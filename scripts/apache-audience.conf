# Anonymous access for the Audience Text submission page.
#
# Installed to /etc/apache2/conf-available/fpp-audience-text.conf and enabled
# with a2enconf by scripts/fpp_install.sh. scripts/fpp_uninstall.sh removes it.
#
# WHY THIS EXISTS
#
# FPP's UI password is applied as a Require directive on <Directory /opt/fpp/www/>
# (see /home/fpp/media/config/ui-password-config.conf, which FPP rewrites every
# time you toggle the setting). Plugin pages are served through
# /opt/fpp/www/plugin.php, so anything inside the plugin framework inherits that
# password -- which is exactly right for the operator's settings page, and
# exactly wrong for a page a room full of strangers is meant to open.
#
# So the audience page is NOT served through plugin.php. It is aliased straight
# out of the plugin's public/ directory, which is not under /opt/fpp/www and
# therefore never sees that Require block at all. Turning the FPP password on or
# off rewrites ui-password-config.conf and does not touch this file.
#
# The <Directory> below needs its own "Require all granted" because Apache's
# global <Directory /> default is "Require all denied"; without it this path
# would 403 for everybody.
#
# Only public/ is exposed. lib/, daemon/, data/ (which holds queue.db) and the
# operator pages stay unreachable from the web because nothing aliases them.
#
# The alias path is also spelled out in lib/common.php (AT_PUBLIC_PATH) and in
# the plugin's setup page, which prints the URL for the operator to share.

Alias /audience /home/fpp/media/plugins/fpp-plugin-AudienceText/public

<Directory "/home/fpp/media/plugins/fpp-plugin-AudienceText/public">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php

    <IfModule mod_headers.c>
        # The queue state on this page goes stale in seconds, and phones on a
        # captive-ish tether are exactly where an aggressive cache shows a
        # guest someone else's message from ten minutes ago.
        Header always set Cache-Control "no-store"
        Header always set X-Content-Type-Options "nosniff"
    </IfModule>
</Directory>
